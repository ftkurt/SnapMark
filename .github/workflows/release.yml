name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package release
        run: ./scripts/package-release.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/SnapMark-arm64.zip \
            release/SnapMark-arm64.zip.sha256 \
            --generate-notes \
            --title "SnapMark ${GITHUB_REF_NAME}"
